[build-system]
requires = ["setuptools>=69", "lxml>=4.6", "regex>=2022.1.18"]
build-backend = "setuptools.build_meta"

[project]
name = "kovidgoyal-langtool"
dynamic = ["version"]
description = "Grammar and style checking based on the LanguageTool rules: a port of the LanguageTool core to Python with a C extension"
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.11"
dependencies = ["lxml>=4.6", "regex>=2022.1.18"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.scripts]
langtool = "langtool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "langtool.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langtool = ["dictionaries.json", "hunspell_dictionaries.json", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist); -n 0: sequentially. loadgroup:
# the tests marked with xdist_group run on one worker (expensive module fixtures)
addopts = "-n auto --dist loadgroup"
markers = [
    "pure_smoke: tests also run in the pure Python mode (LANGTOOL_PURE_PYTHON=1 pytest -m pure_smoke)",
    "xdist_group(name): run the tests of the group on one pytest-xdist worker (with --dist loadgroup)",
]
