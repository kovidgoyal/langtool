name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.14']
        include:
          - os: ubuntu-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up the cache directories
        run: |
          # the downloads (dictionaries) are kept between runs; the derived data
          # (pickles keyed on the package fingerprint) are not
          echo "LANGTOOL_CACHE_DIR=${RUNNER_TEMP}/langtool-cache" >> "$GITHUB_ENV"
          echo "LANGTOOL_DISK_CACHE_DIR=${RUNNER_TEMP}/langtool-derived" >> "$GITHUB_ENV"

      - name: Cache the downloaded dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/langtool-cache
          key: langtool-downloads-${{ github.job }}-${{ runner.os }}-${{ hashFiles('src/langtool/dictionaries.json', 'src/langtool/hunspell_dictionaries.json') }}

      - name: Install the dependencies
        run: python -m pip install --upgrade pip setuptools lxml regex pytest pytest-xdist pytest-timeout

      - name: Build the C extension and the static rule tables
        run: python setup.py build_ext --inplace

      - name: Check that the C extension and the rule tables were built
        run: |
          # (the extension is optional: setup.py does not fail if it can not be built)
          python -c "import langtool._speedups"
          ls src/langtool/_rule_tables/*.ltrt > /dev/null

      - name: Run the tests
        # (diagnostics for hanging tests: the failures are reported when they happen and the tests running for long
        # are listed (tests/conftest.py); faulthandler dumps the tracebacks of a test still running after 20 minutes,
        # pytest-timeout ends it (and its xdist worker) after 45 minutes; the 30 slowest tests are listed)
        env:
          LANGTOOL_TEST_DIAGNOSTICS: '1'
        run: python -m pytest -q -o faulthandler_timeout=1200 --timeout=2700 --durations=30 tests

  pure-python:
    name: Pure Python smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANGTOOL_PURE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up the cache directories
        run: |
          echo "LANGTOOL_CACHE_DIR=${RUNNER_TEMP}/langtool-cache" >> "$GITHUB_ENV"
          echo "LANGTOOL_DISK_CACHE_DIR=${RUNNER_TEMP}/langtool-derived" >> "$GITHUB_ENV"

      - name: Cache the downloaded dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/langtool-cache
          key: langtool-downloads-${{ github.job }}-${{ runner.os }}-${{ hashFiles('src/langtool/dictionaries.json', 'src/langtool/hunspell_dictionaries.json') }}

      - name: Install the dependencies
        run: python -m pip install --upgrade pip lxml regex pytest pytest-xdist

      - name: Run the pure Python smoke tests
        run: python -m pytest -q -m pure_smoke tests

  language-rules:
    name: Rule examples of all languages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANGTOOL_LANGUAGE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up the cache directories
        run: |
          echo "LANGTOOL_CACHE_DIR=${RUNNER_TEMP}/langtool-cache" >> "$GITHUB_ENV"
          echo "LANGTOOL_DISK_CACHE_DIR=${RUNNER_TEMP}/langtool-derived" >> "$GITHUB_ENV"

      - name: Cache the downloaded dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/langtool-cache
          key: langtool-downloads-${{ github.job }}-${{ runner.os }}-${{ hashFiles('src/langtool/dictionaries.json', 'src/langtool/hunspell_dictionaries.json') }}

      - name: Install the dependencies
        run: python -m pip install --upgrade pip setuptools lxml regex pytest pytest-xdist

      - name: Build the C extension and the static rule tables
        run: python setup.py build_ext --inplace

      - name: Run the rule examples of all languages against the baseline
        run: python -m pytest -q tests/test_language_rules.py
